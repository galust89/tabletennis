<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Tournament</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a table-blue scoreboard band on top, then three views (groups, matches, playoffs) on a calm cool surface. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#14213a; --muted:#5a6780; --line:#d8dee9;
  --table:#17407a; --table-ink:#ffffff; --link:#1b55a6;
  --accent:#d9650b; --accent-soft:#fdebd9;
  --good:#1c7f55; --good-soft:#e2f4ea; --bad:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1524; --surface:#152035; --ink:#e7ecf6; --muted:#9aa8c0; --line:#27354f;
    --table:#12305c; --table-ink:#ffffff; --link:#8bb6f2;
    --accent:#ff9a3d; --accent-soft:#3a2a17;
    --good:#56c794; --good-soft:#173527; --bad:#ff8a80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1524; --surface:#152035; --ink:#e7ecf6; --muted:#9aa8c0; --line:#27354f;
  --table:#12305c; --table-ink:#ffffff; --link:#8bb6f2;
  --accent:#ff9a3d; --accent-soft:#3a2a17;
  --good:#56c794; --good-soft:#173527; --bad:#ff8a80;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}

/* Scoreboard band */
.band{background:var(--table);color:var(--table-ink);border-bottom:4px solid var(--accent)}
.band .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-top:22px;padding-bottom:18px}
h1{font:700 clamp(30px,5vw,44px)/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;opacity:.85}
.progress{min-width:220px;flex:0 1 300px}
.progress p{margin:0 0 6px;font-size:14px;opacity:.9}
.bar{height:6px;background:rgba(255,255,255,.22);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:3px}
.sync{margin:8px 0 0;font-size:13px;opacity:.9}
.sync.bad{opacity:1;font-weight:600;color:#ffd9b8}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.btn.danger{color:var(--bad)}

/* Tabs and admin strip */
.nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.nav .wrap{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tab{padding:12px 14px;text-decoration:none;color:var(--muted);font:600 19px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;border-bottom:3px solid transparent}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.adminbar{margin-left:auto;display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px;color:var(--muted)}
.adminbar .btn{padding:5px 10px;font-size:14px}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-weight:600;font-size:13px}

main{padding:24px 0 56px}
h2{font:700 26px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0}
.note{color:var(--muted);font-size:14px;margin:6px 0 18px;max-width:65ch}

/* Group cards */
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card header a{font-size:14px;white-space:nowrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase;text-align:right;padding:8px 8px;white-space:nowrap}
td{padding:8px 8px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left;width:99%}
td:first-child,th:first-child{padding-left:14px;text-align:left;color:var(--muted)}
td:last-child,th:last-child{padding-right:14px}
tr.q td:first-child{box-shadow:inset 4px 0 0 var(--good);color:var(--ink);font-weight:600}
.badge{display:inline-block;margin-left:8px;background:var(--good-soft);color:var(--good);border-radius:4px;padding:0 6px;font-size:12px;font-weight:600}
td b{font-weight:600}
input.nm{width:100%;min-width:150px;border:1px dashed var(--line);border-radius:4px;background:transparent;padding:3px 6px}
select.rk{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:2px 4px;font-size:13px}

/* Matches */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--table);border-color:var(--table);color:#fff}
.mgroup{margin-bottom:22px}
.mgroup>h3{font:700 20px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px}
.round{font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:10px 14px 4px}
.m{display:grid;grid-template-columns:3.2ch minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.m .no{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.m .a{text-align:right}
.pl.win{font-weight:600}
.pl.win::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:7px;vertical-align:middle}
.pl.tbd{color:var(--muted);font-style:italic}
.sc{display:flex;gap:6px;align-items:center;justify-content:center;min-width:64px;font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}
.sc .sep{color:var(--muted);font-weight:400}
.sc.empty{color:var(--muted);font-weight:400;font-size:15px;font-family:var(--body)}
input[type=number]{width:46px;text-align:center;border:1px solid var(--line);border-radius:5px;background:var(--accent-soft);padding:5px 2px;font:600 16px/1 var(--body);font-variant-numeric:tabular-nums}
input[type=number]:disabled{background:transparent;opacity:.45}
.tie{grid-column:2/-1;color:var(--bad);font-size:13px;text-align:center}

/* Bracket */
.bscroll{overflow-x:auto;padding-bottom:8px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(215px,1fr));gap:18px;min-width:920px}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.col>h3{font:700 17px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0;flex:0 0 auto}
.ko{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ko.final{border-color:var(--accent);border-width:2px}
.kl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}
.kr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;min-height:40px}
.kr+.kr{border-top:1px solid var(--line)}
.kr .ks{font:700 19px/1 var(--display);font-variant-numeric:tabular-nums}
.kr.win{background:var(--good-soft)}
.kr.win .pl::after{display:none}
.podium{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 20px}
.podium div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-width:180px}
.podium small{display:block;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.podium b{font:700 22px/1.2 var(--display)}
.podium .gold{border-color:var(--accent);border-width:2px}

/* Dialogs */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:22px;width:min(92vw,420px)}
dialog.wide{width:min(92vw,620px)}
dialog::backdrop{background:rgba(8,14,26,.55)}
dialog h2{margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 10px;color:var(--ink)}
.field textarea{min-height:170px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}
.msg{min-height:1.3em;font-size:14px;margin:0 0 6px;color:var(--bad)}
.msg.ok{color:var(--good)}
@media (max-width:520px){
  .m{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;padding:8px 10px}
  .m .no{display:none}
  .tie{grid-column:1/-1}
  input[type=number]{width:40px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<div class="band">
  <div class="wrap">
    <div>
      <h1>Table Tennis Tournament</h1>
      <p class="sub"><strong>Starts Wednesday, 18 November 2026</strong></p>
      <p class="sub">37 players, 8 groups, top two from each group go to the playoffs</p>
    </div>
    <div class="progress">
      <p id="progress-text"></p>
      <div class="bar"><i id="progress-bar" style="width:0"></i></div>
      <p class="sync" id="sync"></p>
    </div>
  </div>
</div>
<nav class="nav" aria-label="Sections">
  <div class="wrap">
    <a class="tab" href="#groups" data-view="groups">Groups</a>
    <a class="tab" href="#matches" data-view="matches">Matches</a>
    <a class="tab" href="#playoffs" data-view="playoffs">Playoffs</a>
    <div class="adminbar" id="adminbar"></div>
  </div>
</nav>
<main class="wrap" id="view"></main>

<dialog id="login-dialog">
  <form id="login-form">
    <h2>Admin sign in</h2>
    <label class="field">Username<input id="login-user" autocomplete="username" required></label>
    <label class="field">Password<input id="login-pass" type="password" autocomplete="current-password" required></label>
    <p class="msg" id="login-msg"></p>
    <div class="row">
      <button type="button" class="btn" id="login-cancel">Cancel</button>
      <button type="submit" class="btn primary">Sign in</button>
    </div>
  </form>
</dialog>

<dialog id="data-dialog" class="wide">
  <h2>Tournament data</h2>
  <p class="note" style="margin-top:0" id="data-note"></p>
  <label class="field">Data<textarea id="data-text" spellcheck="false"></textarea></label>
  <p class="msg" id="data-msg"></p>
  <div class="row">
    <button type="button" class="btn danger" id="data-clear" style="margin-right:auto">Clear all results</button>
    <button type="button" class="btn" id="data-copy">Copy</button>
    <button type="button" class="btn" id="data-load">Load this data</button>
    <button type="button" class="btn primary" id="data-close">Done</button>
  </div>
</dialog>

<script>
(function(){
"use strict";
/* ---------- Tournament setup (from the original schedule) ---------- */
var GROUPS={
  A:["Samvel Asatryan","Vahagn Grigoryan","Aliaksei Stsepchanka","Vahe Stepanyan","Mher Avoyan"],
  B:["Vahagn Hovhannisyan","David Mamikonyan","Tigran Mkrtchyan","Vahe Hayrapetyan","Narek Nazari"],
  C:["Arsen Khurshudyan","Tigran Ter-Sahakyan","Avet Sargsyan","Vanik Harutyunyan","Gagik Khalafyan"],
  D:["Galust Bayburtsyan","Davit Zakharyan","Denis Masterov","Hovhannes Baghdasaryan"],
  E:["Vahan Mnatsakanyan","Haykanush Abelyan","Alexander Dainiak","Gevorg Melkonyan"],
  F:["Ruben Hovhannisyan","Aram Vanyan","Tatevik Sargsyan1","Armen Hovhannisyan2"],
  G:["Khachatur Khachatryan","Michael Avetisyan","Artavazd Grigoryan","Meri Srapyan"],
  H:["Norayr Hakobyan","Harut Khachatryan","Arsen Abrahamyan","Hripsime Muradyan","Lusine Simonyan"]
};
var P4=[[[0,3],[1,2]],[[0,2],[3,1]],[[0,1],[2,3]]];
var P5=[[[0,4],[1,3]],[[0,3],[2,4]],[[0,2],[1,4]],[[0,1],[2,3]],[[1,2],[3,4]]];
var R16=[["A","B"],["C","D"],["E","F"],["G","H"],["B","A"],["D","C"],["F","E"],["H","G"]];
var GN=Object.keys(GROUPS), PLAYERS=[], GID={}, M=[];
GN.forEach(function(g){
  GID[g]=GROUPS[g].map(function(n){PLAYERS.push({name:n,g:g});return PLAYERS.length-1;});
  (GID[g].length===5?P5:P4).forEach(function(pairs,r){
    pairs.forEach(function(p){M.push({id:M.length+1,g:g,r:r+1,a:GID[g][p[0]],b:GID[g][p[1]]});});
  });
});
/* Late entries: added after results existed, so they are appended (new player id and new match ids at
   the end) instead of inserted into GROUPS, which would shift every id after them. Each late player
   plays everyone already in the group, one match per extra round. */
var LATE=[["E","Norayr Antonyan"]];
LATE.forEach(function(x){
  var g=x[0],p=PLAYERS.push({name:x[1],g:g})-1,others=GID[g].slice(),r=0;
  M.forEach(function(m){if(m.g===g&&m.r>r)r=m.r;});
  GID[g].push(p);
  others.forEach(function(o,i){M.push({id:M.length+1,g:g,r:r+i+1,a:o,b:p});});
});

/* ---------- State ---------- */
var KEY="tt-tournament-v1";
var state={scores:{},ko:{},names:{},rank:{}};
function adopt(s){
  if(!s||typeof s!=="object")return false;
  state={scores:s.scores||{},ko:s.ko||{},names:s.names||{},rank:s.rank||{}};
  return true;
}
try{adopt(JSON.parse(localStorage.getItem(KEY)));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
var admin=false;
try{admin=sessionStorage.getItem("tt-admin")==="1";}catch(e){}
var filter="all";

/* ---------- Server sync (falls back to this browser only when there is no server) ---------- */
var mode="connecting",pending=0,saveErr=false,token=null,chain=Promise.resolve();
try{token=sessionStorage.getItem("tt-token");}catch(e){}
function api(path,opts){
  return fetch(path,opts).then(function(r){
    if((r.headers.get("content-type")||"").indexOf("application/json")<0)throw new Error("no api");
    return r.json().then(function(j){return {status:r.status,body:j};});
  });
}
function signOut(){
  admin=false;token=null;
  try{sessionStorage.removeItem("tt-admin");sessionStorage.removeItem("tt-token");}catch(x){}
}
function pull(){
  var a=document.activeElement;
  if(pending>0||(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)))return;
  api("/api/state",{cache:"no-store"}).then(function(r){
    if(r.status!==200)throw new Error("bad status");
    mode="live";
    if(admin&&!token)signOut();
    if(pending===0){adopt(r.body.state);save();}
    render();
  }).catch(function(){
    if(mode==="connecting"){mode="local";render();}
  });
}
function push(payload){
  if(mode!=="live")return;
  pending++;render2();
  chain=chain.then(function(){
    return api("/api/state",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+token},body:JSON.stringify(payload)});
  }).then(function(r){
    pending--;
    if(r.status===401){signOut();saveErr=true;rerender();return;}
    saveErr=r.status!==200;render2();
  },function(){pending--;saveErr=true;render2();});
}
function render2(){
  var s=document.getElementById("sync");
  s.textContent=mode==="live"?(saveErr?"The last change was not saved. Check your connection and sign in again.":pending?"Saving...":"Live results, shared with everyone"):mode==="local"?"Results are saved in this browser only":"";
  s.className="sync"+(saveErr?" bad":"");
}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function nm(p){return state.names[p]||PLAYERS[p].name;}
function sc(store,k){var v=store[k];return v&&Number.isInteger(v[0])&&Number.isInteger(v[1])?v:null;}

/* ---------- Calculations ---------- */
function table(g){
  var by={},h={};
  var rows=GID[g].map(function(p){return by[p]={p:p,mp:0,w:0,sw:0,sl:0};});
  M.forEach(function(m){
    if(m.g!==g)return;var s=sc(state.scores,m.id);if(!s)return;
    var A=by[m.a],B=by[m.b];A.mp++;B.mp++;A.sw+=s[0];A.sl+=s[1];B.sw+=s[1];B.sl+=s[0];
    if(s[0]>s[1]){A.w++;h[m.a+">"+m.b]=1;}else if(s[1]>s[0]){B.w++;h[m.b+">"+m.a]=1;}
  });
  rows.sort(function(x,y){
    return y.w-x.w||(y.sw-y.sl)-(x.sw-x.sl)||y.sw-x.sw||(h[y.p+">"+x.p]?1:0)-(h[x.p+">"+y.p]?1:0)||x.p-y.p;
  });
  return rows;
}
function groupDone(g){
  return M.every(function(m){if(m.g!==g)return true;var s=sc(state.scores,m.id);return s&&s[0]!==s[1];});
}
function quals(g){
  var first=null,second=null;
  GID[g].forEach(function(p){if(state.rank[p]===1)first=p;if(state.rank[p]===2)second=p;});
  if(groupDone(g)){
    var rest=table(g).map(function(r){return r.p;}).filter(function(p){return p!==first&&p!==second;});
    if(first==null)first=rest.shift();
    if(second==null)second=rest.shift();
  }
  return [first==null?null:first,second==null?null:second];
}
function bracket(){
  var q={},b={};
  GN.forEach(function(g){q[g]=quals(g);});
  function mk(k,label,a,c,la,lb){
    var s=sc(state.ko,k),w=null,l=null;
    if(a!=null&&c!=null&&s&&s[0]!==s[1]){w=s[0]>s[1]?a:c;l=s[0]>s[1]?c:a;}
    b[k]={k:k,label:label,a:a,b:c,la:la,lb:lb,w:w,l:l,s:state.ko[k]||[null,null]};
  }
  R16.forEach(function(p,i){mk("R"+(i+1),"Round of 16 · M"+(i+1),q[p[0]][0],q[p[1]][1],"1st Group "+p[0],"2nd Group "+p[1]);});
  [[1,8],[2,7],[3,6],[4,5]].forEach(function(p,i){mk("Q"+(i+1),"Quarterfinal "+(i+1),b["R"+p[0]].w,b["R"+p[1]].w,"Winner R16 M"+p[0],"Winner R16 M"+p[1]);});
  [[1,3],[2,4]].forEach(function(p,i){mk("S"+(i+1),"Semifinal "+(i+1),b["Q"+p[0]].w,b["Q"+p[1]].w,"Winner QF "+p[0],"Winner QF "+p[1]);});
  mk("T","3rd place",b.S1.l,b.S2.l,"Loser SF 1","Loser SF 2");
  mk("F","Final",b.S1.w,b.S2.w,"Winner SF 1","Winner SF 2");
  return b;
}

/* ---------- Rendering ---------- */
function scoreInput(store,k,side,val,enabled,label){
  return '<input type="number" min="0" max="9" inputmode="numeric" id="i-'+store+'-'+k+'-'+side+'" data-store="'+store+'" data-k="'+k+'" data-side="'+side+'" value="'+(val==null?"":val)+'"'+(enabled?"":" disabled")+' aria-label="'+esc(label)+'">';
}
function standings(g){
  var rows=table(g),q=quals(g);
  var h='<div class="tw"><table><thead><tr><th>#</th><th>Player</th><th title="Matches played">MP</th><th title="Wins">W</th><th title="Losses">L</th><th title="Sets won and lost">Sets</th><th title="Set difference">+/-</th>'+(admin?'<th>Rank</th>':'')+'</tr></thead><tbody>';
  rows.forEach(function(r,i){
    var qi=q.indexOf(r.p),d=r.sw-r.sl;
    h+='<tr'+(qi>=0?' class="q"':'')+'><td>'+(i+1)+'</td><td>'+
      (admin?'<input class="nm" id="n-'+r.p+'" data-pid="'+r.p+'" value="'+esc(nm(r.p))+'" aria-label="Player name">':esc(nm(r.p)))+
      (qi>=0?'<span class="badge">'+(qi===0?"1st":"2nd")+'</span>':'')+'</td><td>'+r.mp+'</td><td><b>'+r.w+'</b></td><td>'+(r.mp-r.w)+'</td><td>'+r.sw+':'+r.sl+'</td><td>'+(d>0?"+":"")+d+'</td>'+
      (admin?'<td><select class="rk" id="r-'+r.p+'" data-pid="'+r.p+'" aria-label="Final rank for '+esc(nm(r.p))+'"><option value="">Auto</option><option value="1"'+(state.rank[r.p]===1?" selected":"")+'>1st</option><option value="2"'+(state.rank[r.p]===2?" selected":"")+'>2nd</option></select></td>':'')+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function matchRow(m){
  var v=state.scores[m.id]||[null,null],s=sc(state.scores,m.id);
  var wa=s&&s[0]>s[1],wb=s&&s[1]>s[0],mid;
  if(admin)mid='<span class="sc">'+scoreInput("scores",m.id,0,v[0],true,nm(m.a)+" sets")+'<span class="sep">:</span>'+scoreInput("scores",m.id,1,v[1],true,nm(m.b)+" sets")+'</span>';
  else mid=s?'<span class="sc">'+s[0]+'<span class="sep">:</span>'+s[1]+'</span>':'<span class="sc empty">vs</span>';
  return '<div class="m"><span class="no">'+m.id+'</span><span class="pl a'+(wa?" win":"")+'">'+esc(nm(m.a))+'</span>'+mid+'<span class="pl b'+(wb?" win":"")+'">'+esc(nm(m.b))+'</span>'+
    (s&&s[0]===s[1]?'<span class="tie">Sets are level. Enter a score with a winner.</span>':'')+'</div>';
}
function viewGroups(){
  var h='<h2>Group standings</h2><p class="note">Ranked by wins, then set difference, then sets won, then the match between the tied players. The top two are marked once every match in the group has a result.</p><div class="groups">';
  GN.forEach(function(g){
    h+='<section class="card"><header><h2>Group '+g+'</h2><a href="#matches" data-goto="'+g+'">Group '+g+' matches</a></header>'+standings(g)+'</section>';
  });
  return h+'</div>';
}
function viewMatches(){
  var h='<h2>Group stage matches</h2><p class="note">'+(admin?"Type the sets won by each player. Standings and the playoff bracket update as you go.":M.length+" matches. Pick a group to see its table and fixtures together.")+'</p><div class="chips" role="group" aria-label="Filter by group">';
  ["all"].concat(GN).forEach(function(g){
    h+='<button type="button" class="chip" data-filter="'+g+'" aria-pressed="'+(filter===g)+'">'+(g==="all"?"All groups":"Group "+g)+'</button>';
  });
  h+='</div>';
  GN.forEach(function(g){
    if(filter!=="all"&&filter!==g)return;
    h+='<section class="mgroup"><h3>Group '+g+'</h3><div class="card">'+(filter===g?standings(g):"");
    var r=0;
    M.forEach(function(m){
      if(m.g!==g)return;
      if(m.r!==r){r=m.r;h+='<div class="round">Round '+r+'</div>';}
      h+=matchRow(m);
    });
    h+='</div></section>';
  });
  return h;
}
function koCard(x){
  function row(p,ph,side,win){
    var known=p!=null,ready=x.a!=null&&x.b!=null;
    return '<div class="kr'+(win?" win":"")+'"><span class="pl'+(known?(win?" win":""):" tbd")+'">'+esc(known?nm(p):ph)+'</span>'+
      (admin?scoreInput("ko",x.k,side,x.s[side],ready,(known?nm(p):ph)+" sets"):'<span class="ks">'+(ready&&x.s[side]!=null?x.s[side]:"")+'</span>')+'</div>';
  }
  return '<div class="ko'+(x.k==="F"?" final":"")+'"><div class="kl">'+x.label+'</div>'+row(x.a,x.la,0,x.w!=null&&x.w===x.a)+row(x.b,x.lb,1,x.w!=null&&x.w===x.b)+'</div>';
}
function viewPlayoffs(){
  var b=bracket();
  function col(title,keys){return '<div class="col"><h3>'+title+'</h3>'+keys.map(function(k){return koCard(b[k]);}).join("")+'</div>';}
  var h='<h2>Playoffs</h2><p class="note">Group winners meet runners-up from the neighbouring group. Places fill in when a group is finished.</p>';
  if(b.F.w!=null){
    h+='<div class="podium"><div class="gold"><small>Champion</small><b>'+esc(nm(b.F.w))+'</b></div><div><small>Runner-up</small><b>'+esc(nm(b.F.l))+'</b></div>'+(b.T.w!=null?'<div><small>3rd place</small><b>'+esc(nm(b.T.w))+'</b></div>':'')+'</div>';
  }
  h+='<div class="bscroll"><div class="bracket">'+
    col("Round of 16",["R1","R8","R3","R6","R2","R7","R4","R5"])+
    col("Quarterfinals",["Q1","Q3","Q2","Q4"])+
    col("Semifinals",["S1","S2"])+
    '<div class="col" style="justify-content:center"><h3>Medal matches</h3>'+koCard(b.F)+koCard(b.T)+'</div></div></div>';
  return h;
}
function render(){
  var v=(location.hash||"").slice(1);
  if(["groups","matches","playoffs"].indexOf(v)<0)v="groups";
  document.querySelectorAll(".tab").forEach(function(t){
    if(t.dataset.view===v)t.setAttribute("aria-current","page");else t.removeAttribute("aria-current");
  });
  document.getElementById("view").innerHTML=v==="groups"?viewGroups():v==="matches"?viewMatches():viewPlayoffs();
  var played=M.filter(function(m){return sc(state.scores,m.id);}).length;
  document.getElementById("progress-text").textContent=played+" of "+M.length+" group matches played";
  document.getElementById("progress-bar").style.width=(played/M.length*100)+"%";
  render2();
  document.getElementById("adminbar").innerHTML=admin
    ?'<span class="pill">Editing as admin</span><button type="button" class="btn" id="open-data">Data</button><button type="button" class="btn" id="sign-out">Sign out</button>'
    :'<button type="button" class="btn" id="sign-in">Admin sign in</button>';
}
function rerender(){
  setTimeout(function(){
    var a=document.activeElement,id=a&&a.id;
    render();
    if(id){var el=document.getElementById(id);if(el&&!el.disabled){el.focus();if(el.select&&el.type==="number")el.select();}}
  },0);
}

/* ---------- Events ---------- */
window.addEventListener("hashchange",render);
document.addEventListener("change",function(e){
  var t=e.target;
  if(!admin)return;
  if(t.matches("input[data-store]")){
    var store=state[t.dataset.store],k=t.dataset.k,v=(store[k]||[null,null]).slice();
    var n=t.value===""?null:Math.max(0,Math.min(9,Math.round(Number(t.value))));
    v[+t.dataset.side]=Number.isFinite(n)?n:null;
    if(v[0]==null&&v[1]==null){delete store[k];v=null;}else store[k]=v;
    save();push({ops:[{store:t.dataset.store,key:String(k),value:v}]});rerender();
  }else if(t.matches("input.nm")){
    var p=+t.dataset.pid,val=t.value.trim();
    if(!val||val===PLAYERS[p].name){delete state.names[p];val=null;}else state.names[p]=val;
    save();push({ops:[{store:"names",key:String(p),value:val}]});rerender();
  }else if(t.matches("select.rk")){
    var pid=+t.dataset.pid,r=+t.value||0,ops=[];
    if(r){GID[PLAYERS[pid].g].forEach(function(o){if(state.rank[o]===r){delete state.rank[o];ops.push({store:"rank",key:String(o),value:null});}});state.rank[pid]=r;}
    else delete state.rank[pid];
    ops.push({store:"rank",key:String(pid),value:r||null});
    save();push({ops:ops});rerender();
  }
});
var loginDlg=document.getElementById("login-dialog"),dataDlg=document.getElementById("data-dialog");
var clearArmed=false;
function dataMsg(text,ok){var m=document.getElementById("data-msg");m.textContent=text;m.className="msg"+(ok?" ok":"");}
document.addEventListener("click",function(e){
  var t=e.target.closest("button,a");if(!t)return;
  if(t.dataset.filter){filter=t.dataset.filter;render();}
  else if(t.dataset.goto){filter=t.dataset.goto;}
  else if(t.id==="sign-in"){document.getElementById("login-msg").textContent="";document.getElementById("login-form").reset();loginDlg.showModal();}
  else if(t.id==="login-cancel"){loginDlg.close();}
  else if(t.id==="sign-out"){signOut();render();}
  else if(t.id==="open-data"){document.getElementById("data-note").textContent=mode==="live"?"Results are saved on the server and shared with everyone. Copy this text to keep a backup; load it to restore one.":"Results are saved in this browser. To move them to another browser or device, copy this text there and load it.";document.getElementById("data-text").value=JSON.stringify(state);dataMsg("");clearArmed=false;document.getElementById("data-clear").textContent="Clear all results";dataDlg.showModal();}
  else if(t.id==="data-close"){dataDlg.close();}
  else if(t.id==="data-copy"){
    var ta=document.getElementById("data-text");
    try{navigator.clipboard.writeText(ta.value).then(function(){dataMsg("Copied.",true);},function(){ta.select();dataMsg("Copy was blocked. The text is selected, press Ctrl+C or Cmd+C.");});}
    catch(x){ta.select();dataMsg("Copy was blocked. The text is selected, press Ctrl+C or Cmd+C.");}
  }
  else if(t.id==="data-load"){
    try{
      var s=JSON.parse(document.getElementById("data-text").value);
      if(!s||typeof s!=="object"||Array.isArray(s))throw 0;
      adopt(s);save();push({replace:state});render();dataMsg("Loaded.",true);
    }catch(x){dataMsg("That text is not valid tournament data. Paste the full text copied from this window.");}
  }
  else if(t.id==="data-clear"){
    if(!clearArmed){clearArmed=true;t.textContent="Click again to clear everything";return;}
    clearArmed=false;t.textContent="Clear all results";
    state={scores:{},ko:{},names:{},rank:{}};save();push({replace:state});render();
    document.getElementById("data-text").value=JSON.stringify(state);dataMsg("All results, names and ranks were reset.",true);
  }
});
document.getElementById("login-form").addEventListener("submit",function(e){
  e.preventDefault();
  var u=document.getElementById("login-user").value.trim(),p=document.getElementById("login-pass").value,msg=document.getElementById("login-msg");
  function ok(){admin=true;saveErr=false;try{sessionStorage.setItem("tt-admin","1");if(token)sessionStorage.setItem("tt-token",token);}catch(x){}loginDlg.close();render();}
  if(mode==="live"){
    api("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:u,password:p})}).then(function(r){
      if(r.status===200&&r.body.token){token=r.body.token;ok();}else msg.textContent="Wrong username or password.";
    },function(){msg.textContent="Could not reach the server. Try again.";});
  }else if(u==="admin"&&p==="admin")ok();
  else msg.textContent="Wrong username or password.";
});
render();
pull();
setInterval(function(){if(!document.hidden)pull();},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)pull();});
})();
</script>
</body>
